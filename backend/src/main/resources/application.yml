spring:
  application:
    name: taskboard
  # DB の接続先。${環境変数名:初期値} の形で、環境変数がなければ「:」の後ろの値を使う
  # パスワードだけは初期値を書かない（コードにも Git にも書かないため。詳細設計書 3.7）
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_app}
    username: ${DB_USERNAME:task_app_user}
    password: ${DB_PASSWORD}
  jpa:
    # 画面に返したあとで勝手に SQL が走るのを防ぐ（詳細設計書 3.3）
    open-in-view: false
    # テーブルは Flyway だけが作る。JPA はクラスとテーブルが合っているかを起動時に確かめるだけ
    hibernate:
      ddl-auto: validate
  session:
    # 何も操作しない時間が30分続いたら、ログアウトした状態にする（要件 U-09）
    timeout: 30m

app:
  # データ量の上限（要件 3.7）。LimitsProperties で読む
  limits:
    boards: 10
    columns: 20
    cards-per-column: 100
    labels: 30
  # 回数制限（要件 U-10）。同じ IP アドレスから、window の間に max-count 回まで。RateLimitProperties で読む
  rate-limit:
    login-failure:
      max-count: 10
      window: 15m
    guest-creation:
      max-count: 10
      window: 1h
