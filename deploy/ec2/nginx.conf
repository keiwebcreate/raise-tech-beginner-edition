# EC2 の Nginx の設定（/etc/nginx/nginx.conf を置き換える。scripts/setup-server.sh）
# - / ：画面のファイル（/opt/taskboard/web。パソコンで npm run build したもの）
# - /api/ ：Spring Boot（127.0.0.1:8080）へ転送する
# Amazon Linux 2023 の初期の nginx.conf をもとに、初期のページの server を外して、このアプリの server を入れた

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # エラーの画面などに Nginx の版を出さない
    server_tokens off;

    # ---- CloudFront の後ろで動かすための設定（段階4。詳細設計書 3.8.8） ----
    # CloudFront を通ると、Nginx から見た接続元は CloudFront になる。
    # CloudFront のアドレス（cloudfront-realip.conf。setup-server.sh が AWS の公開の一覧から作る）から来たときだけ、
    # X-Forwarded-For の右から順に CloudFront のアドレスを飛ばし、最初の CloudFront でないアドレスを本当の接続元にする。
    # CloudFront は、ブラウザの値の右に、自分が見た接続元を必ず足すので、ブラウザが嘘の値を書いても無視される
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/cloudfront-realip.conf;

    # この通信が CloudFront から来たか（$realip_remote_addr は、書き換える前の、本当につないできた相手）
    geo $realip_remote_addr $via_cloudfront {
        default 0;
        include /etc/nginx/cloudfront-geo.conf;
    }

    # 元は https だったか。CloudFront から来たときだけ、CloudFront が付ける印（CloudFront-Forwarded-Proto）を信用する
    map "$via_cloudfront:$http_cloudfront_forwarded_proto" $original_proto {
        default   $scheme;
        "1:https" https;
    }
    map $original_proto $original_port {
        default $server_port;
        https   443;
    }

    server {
        listen      80 default_server;
        server_name _;
        root        /opt/taskboard/web;

        # 送られてくるデータの上限（カードの説明など。API の上限より十分大きい）
        client_max_body_size 1m;

        # API：Spring Boot へ転送する。セキュリティのヘッダーは Spring Security が付ける
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            # 本当の接続元（回数制限で使う。詳細設計書 3.8.8）。
            # $remote_addr は、上の real_ip で CloudFront の後ろの本当の接続元に直したもの。
            # ブラウザが送ってきた X-Forwarded-For はそのまま渡さず、この値で上書きする（偽装を防ぐ）
            proxy_set_header   X-Forwarded-For   $remote_addr;
            # 元は https だったか（Spring Boot が Cookie に Secure を付けるかどうかを決めるのに使う）
            proxy_set_header   X-Forwarded-Proto $original_proto;
            # ポート番号も、ブラウザの値ではなく、ここで決めた値で上書きする（Spring Boot の native が読むため）
            proxy_set_header   X-Forwarded-Port  $original_port;
        }

        # 画面のファイルのうち、名前に中身の印（ハッシュ）が付いたもの：長く保存させる
        location /assets/ {
            expires 1y;
            include /etc/nginx/taskboard-headers.conf;
            try_files $uri =404;
        }

        # 画面の入口：新しい版をすぐ反映するため、保存させない
        location = /index.html {
            expires epoch;
            include /etc/nginx/taskboard-headers.conf;
        }

        # そのほか：ファイルがあれば返し、なければ画面の入口を返す
        # （/boards/3 などを直接開いたり、再読み込みしたりしても、画面が出るように）
        location / {
            include /etc/nginx/taskboard-headers.conf;
            try_files $uri /index.html;
        }
    }
}
