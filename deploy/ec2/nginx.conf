# EC2 の Nginx の設定（/etc/nginx/nginx.conf を置き換える。scripts/setup-server.sh）
# - / ：画面のファイル（/opt/taskboard/web。パソコンで npm run build したもの）
# - /api/ ：Spring Boot（127.0.0.1:8080）へ転送する
# Amazon Linux 2023 の初期の nginx.conf をもとに、初期のページの server を外して、このアプリの server を入れた

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # エラーの画面などに Nginx の版を出さない
    server_tokens off;

    server {
        listen      80 default_server;
        server_name _;
        root        /opt/taskboard/web;

        # 送られてくるデータの上限（カードの説明など。API の上限より十分大きい）
        client_max_body_size 1m;

        # API：Spring Boot へ転送する。セキュリティのヘッダーは Spring Security が付ける
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            # 本当の接続元（回数制限で使う。詳細設計書 3.8.8）。
            # ブラウザが送ってきた X-Forwarded-For は使わず、Nginx が見た接続元で上書きする（偽装を防ぐ）
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 画面のファイルのうち、名前に中身の印（ハッシュ）が付いたもの：長く保存させる
        location /assets/ {
            expires 1y;
            include /etc/nginx/taskboard-headers.conf;
            try_files $uri =404;
        }

        # 画面の入口：新しい版をすぐ反映するため、保存させない
        location = /index.html {
            expires epoch;
            include /etc/nginx/taskboard-headers.conf;
        }

        # そのほか：ファイルがあれば返し、なければ画面の入口を返す
        # （/boards/3 などを直接開いたり、再読み込みしたりしても、画面が出るように）
        location / {
            include /etc/nginx/taskboard-headers.conf;
            try_files $uri /index.html;
        }
    }
}
