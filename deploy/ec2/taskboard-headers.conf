# 画面のファイルに付けるセキュリティのヘッダー（要件 NS-10。詳細設計書 4.9）
# /etc/nginx/taskboard-headers.conf に置き、nginx.conf の location から読み込む。
# （Nginx は location の中に add_header があると、外側の add_header を引き継がないため、
#   location ごとに同じものを読み込む）
# HSTS（HTTPS の強制）は、HTTPS にする段階4で足す

# 他のサイトに埋め込ませない（クリックジャッキング対策。<meta> の CSP では効かないのでヘッダーで送る）
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# ファイルの種類を、ブラウザに推測させない
add_header X-Content-Type-Options "nosniff" always;
# 別のサイトへ移るときに、URL の全体を渡さない
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
