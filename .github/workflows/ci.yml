# 自動テスト（要件 5章、イシュー #39）
# PR を作ったとき・PR のブランチに push したときと、main に反映したとき（マージ）に走る。
# サーバーと画面は別々のジョブにして、同時に走らせる。
# ジョブの名前（backend・frontend）は、main のルールセットの「成功が必須のチェック」に登録している。変えるときはルールセットも直す

name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR に続けて push したら、前の実行は止めて新しいほうだけを走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# リポジトリの中身を読むだけ（書き込みはしない）
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Java 25 を用意する
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Gradle と、ダウンロードしたライブラリを次回のために取っておく
      - name: Gradle を用意する
        uses: gradle/actions/setup-gradle@v6

      # テスト（DB は Testcontainers が Docker で PostgreSQL 18 を立ち上げる）・Checkstyle・SpotBugs
      - name: テストとチェック（./gradlew check）
        run: ./gradlew check

      # 失敗したときは、テストとチェックの結果を GitHub の画面からダウンロードできるようにする
      - name: 結果を保存する（失敗したときだけ）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: backend/build/reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node.js 26 を用意する
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          # ダウンロードしたパッケージを次回のために取っておく
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json のとおりに入れる（npm install と違い、lock ファイルを書き換えない）
      - name: パッケージを入れる
        run: npm ci

      - name: コードのチェック（oxlint）
        run: npm run lint

      - name: 書き方のチェック（Prettier）
        run: npm run format:check

      - name: テスト（Vitest）
        run: npm test

      - name: 型チェックと本番用の作成
        run: npm run build
